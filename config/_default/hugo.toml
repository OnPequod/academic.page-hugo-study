# Hugo configuration for a site built from the Academic.page Content API.
#
# The API key, site ID, and API address come from environment variables
# (ACADEMIC_PAGE_TOKEN, ACADEMIC_PAGE_SITE, ACADEMIC_PAGE_BASE_URL). Nothing
# secret belongs in this file.

# Set the production address with --baseURL or HUGO_BASEURL when deploying.
baseURL = 'http://localhost:1313/'
locale = 'en-us'
# The site's real name comes from the API; this is only Hugo's fallback.
title = 'Academic.page site'
enableRobotsTXT = true
# The API returns only published records, so a future date is real: an
# upcoming talk, say. Hugo skips future-dated pages unless this is on.
buildFuture = true

[pagination]
  pagerSize = 5

[taxonomies]
  tag = 'tags'

# RSS is turned on for the posts section only (see the posts adapter).
[outputs]
  home = ['html']
  page = ['html']
  section = ['html']
  taxonomy = ['html']
  term = ['html']

[mediaTypes.'application/x-bibtex']
  suffixes = ['bib']

[security]
  # Page content from the API is HTML that Academic.page renders and
  # sanitizes. Hugo refuses text/html page content unless it is allowed here.
  allowContent = ['! ^text/org$']
  [security.funcs]
    # Let templates read the API settings, and nothing else new.
    getenv = ['^HUGO_', '^CI$', '^ACADEMIC_PAGE_']
  [security.http]
    mediaTypes = ['^application/json', '^application/x-bibtex']

[caches]
  # Fetch fresh API responses on every build. Hugo's default (-1) caches
  # remote resources forever, which would serve stale content.
  [caches.getresource]
    maxAge = 0

[params.academicPage]
  # "html" uses the HTML the API renders. "json" renders the Tiptap document
  # with this repository's own templates (layouts/_partials/richtext/).
  richText = 'html'
  # How the publications page groups entries: "year" or "type".
  publicationsGroupBy = 'year'
